server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,metrics

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# httpOnly cookie for the JWT — must be true whenever reachable over the
# public internet (Secure requires TLS); false only in local/dev .env
cookie.secure=${COOKIE_SECURE:true}

# Rate limiter para login: máximo 5 intentos por minuto por instancia
resilience4j.ratelimiter.instances.loginRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginRateLimiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.loginRateLimiter.timeout-duration=0

# Swagger / OpenAPI 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
