server.port=8081
spring.application.name=auth-service

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:auth_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway baseline — adopta el esquema ya creado por ddl-auto=update sin
# recrearlo (baseline-version coincide con V1__baseline.sql, ver
# flyway-migration-baseline.md §4.4). Aplica igual sobre una BD vacía
# (baseline no se activa, V1 corre como migración real) y sobre una BD
# existente (baseline-only, ninguna fila se toca).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=ddl-auto=update baseline pre-Flyway

management.endpoints.web.exposure.include=health,info,metrics

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Secreto de autenticación interna servicio-a-servicio — distinto de JWT_SECRET.
# Sin valor por defecto: el arranque falla si no está configurado (mismo
# criterio que jwt.secret/DB_PASS en los demás servicios).
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# httpOnly cookie for the JWT — must be true whenever reachable over the
# public internet (Secure requires TLS); false only in local/dev .env
cookie.secure=${COOKIE_SECURE:true}

# Rate limiter para login: máximo 5 intentos por minuto por instancia
resilience4j.ratelimiter.instances.loginRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.loginRateLimiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.loginRateLimiter.timeout-duration=0

# Rate limiter dedicado para rectificación de email (derecho ARCO+): mismo
# límite que loginRateLimiter (5/60s, global) — mitiga el password-oracle de
# PUT /auth/interno/usuarios/{email} (arco-remaining-rights.md §4.1/§7 A04).
# NO reutiliza loginRateLimiter: son endpoints distintos con presupuestos
# de abuso independientes.
resilience4j.ratelimiter.instances.rectificacionRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.rectificacionRateLimiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.rectificacionRateLimiter.timeout-duration=0

# Rate limiter dedicado para cancelación de cuenta (derecho ARCO+): mismo
# límite que loginRateLimiter/rectificacionRateLimiter (5/60s, global) — mitiga
# el password-oracle de PUT /auth/interno/usuarios/{email}/cancelacion/iniciar
# (arco-cancelacion-oposicion.md §6.1/§7 A04). NO reutiliza los otros dos:
# presupuesto de abuso independiente por endpoint.
resilience4j.ratelimiter.instances.cancelacionRateLimiter.limit-for-period=5
resilience4j.ratelimiter.instances.cancelacionRateLimiter.limit-refresh-period=60s
resilience4j.ratelimiter.instances.cancelacionRateLimiter.timeout-duration=0

# Swagger / OpenAPI
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
