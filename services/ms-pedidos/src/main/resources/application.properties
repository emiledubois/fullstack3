server.port=8083
spring.application.name=ms-pedidos

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:pedidos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

management.endpoints.web.exposure.include=health,info,metrics

# Secreto de autenticación interna servicio-a-servicio — distinto de JWT_SECRET.
# Sin valor por defecto: el arranque falla si no está configurado (mismo
# criterio que jwt.secret/DB_PASS en los demás servicios).
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# ── URLs de servicios para la Saga (sobreescritas en Docker por env vars) ──
inventario.service.url=${INVENTARIO_URL:http://ms-inventario:8082}
envios.service.url=${ENVIOS_URL:http://ms-envios:8084}
notification.service.url=${NOTIFICATION_URL:http://notification-service:8085}

# ── Circuit Breakers específicos para la Saga ──
resilience4j.circuitbreaker.instances.inventario-saga.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventario-saga.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.inventario-saga.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.inventario-saga.permitted-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.envios-saga.sliding-window-size=5
resilience4j.circuitbreaker.instances.envios-saga.failure-rate-threshold=60
resilience4j.circuitbreaker.instances.envios-saga.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.envios-saga.permitted-calls-in-half-open-state=2

resilience4j.circuitbreaker.instances.notification-saga.sliding-window-size=3
resilience4j.circuitbreaker.instances.notification-saga.failure-rate-threshold=80
resilience4j.circuitbreaker.instances.notification-saga.wait-duration-in-open-state=10s

# Swagger / OpenAPI 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
