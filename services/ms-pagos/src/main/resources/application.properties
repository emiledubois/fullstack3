# Servidor
server.port=8086
spring.application.name=ms-pagos

# Base de datos — sobreescrita por env vars en Docker
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:pagos_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway baseline — adopta el esquema ya creado por ddl-auto=update sin
# recrearlo (baseline-version coincide con V1__baseline.sql, ver
# flyway-migration-baseline.md §4.4). Aplica igual sobre una BD vacía
# (baseline no se activa, V1 corre como migración real) y sobre una BD
# existente (baseline-only, ninguna fila se toca).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=ddl-auto=update baseline pre-Flyway

# Flow API — Fuente: developers.flow.cl (Primeros pasos)
# Sandbox: https://sandbox.flow.cl/api
# Producción: https://www.flow.cl/api
flow.api.url=${FLOW_API_URL:https://sandbox.flow.cl/api}
flow.api.key=${FLOW_API_KEY:TU_API_KEY_SANDBOX}
flow.api.secret=${FLOW_SECRET_KEY:TU_SECRET_KEY_SANDBOX}
flow.verify.signature=${FLOW_VERIFY_SIGNATURE:true}

# URLs de callback — Flow necesita URLs públicas para el webhook
# En desarrollo local: usar ngrok
flow.url.confirmation=${FLOW_URL_CONFIRMATION:https://TU_NGROK.ngrok-free.app/pagos/webhook/flow}
flow.url.return=${FLOW_URL_RETURN:http://localhost:5173/pago-resultado}

# URL interna de ms-pedidos para confirmar pago
pedidos.service.url=${PEDIDOS_URL:http://ms-pedidos:8083}

# Secreto de autenticación interna servicio-a-servicio — distinto de JWT_SECRET.
# Sin valor por defecto: el arranque falla si no está configurado (mismo
# criterio que jwt.secret/DB_PASS en los demás servicios).
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# Actuator
management.endpoints.web.exposure.include=health,info

# Swagger / OpenAPI 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
