server.port=8084
spring.application.name=ms-envios
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:envios_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway baseline — adopta el esquema ya creado por ddl-auto=update sin
# recrearlo (baseline-version coincide con V1__baseline.sql, ver
# flyway-migration-baseline.md §4.4). Aplica igual sobre una BD vacía
# (baseline no se activa, V1 corre como migración real) y sobre una BD
# existente (baseline-only, ninguna fila se toca).
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=ddl-auto=update baseline pre-Flyway

management.endpoints.web.exposure.include=health,info,metrics

# Incluye el correlationId (MDC, ver CorrelationIdFilter) en cada línea de
# log — observability-correlation-ids.md §5.4.
logging.pattern.level=%5p [cid=%X{correlationId:-none}]

# Secreto de autenticación interna servicio-a-servicio — distinto de JWT_SECRET.
# Sin valor por defecto: el arranque falla si no está configurado (mismo
# criterio que jwt.secret/DB_PASS en los demás servicios).
internal.service.secret=${INTERNAL_SERVICE_SECRET}

# Swagger / OpenAPI 
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
