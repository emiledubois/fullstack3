server.port=8080
spring.application.name=api-gateway

# JWT secret — must match the value used by auth-service
jwt.secret=${JWT_SECRET}

# Secreto de autenticación interna servicio-a-servicio — distinto de JWT_SECRET.
# Sin valor por defecto: el arranque falla si no está configurado (mismo
# criterio que jwt.secret/DB_PASS).
internal.service.secret=${INTERNAL_SERVICE_SECRET}

management.endpoints.web.exposure.include=health,info

inventario.service.url=${INVENTARIO_URL:http://ms-inventario:8082}
pedidos.service.url=${PEDIDOS_URL:http://ms-pedidos:8083}
envios.service.url=${ENVIOS_URL:http://ms-envios:8084}
auth.service.url=${AUTH_URL:http://auth-service:8081}

# httpOnly cookie for the rotated JWT (rectificación de email) — mismo flag
# que auth-service's AuthController.login, ver arco-remaining-rights.md §4.1.
cookie.secure=${COOKIE_SECURE:true}
