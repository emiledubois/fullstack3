name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan catches newly-disclosed vuln patterns even with no code changes
    - cron: '17 3 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  analyze-java:
    name: analyze (java)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      # Each service is an independent Maven project (database-per-service, no
      # aggregator root pom), so CodeQL needs each one built explicitly.
      - name: Build all services
        run: |
          for svc in api-gateway auth-service ms-inventario ms-pedidos ms-envios notification-service ms-pagos; do
            echo "== Building $svc =="
            (cd "services/$svc" && chmod +x mvnw && ./mvnw -B -q -DskipTests compile)
          done

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'

  analyze-javascript:
    name: analyze (javascript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:javascript-typescript'
