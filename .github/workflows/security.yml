name: Security Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Dependency vulnerability databases update daily; catch new CVEs on unchanged code
    - cron: '0 4 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  secret-scan:
    name: secret-scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: dependency-scan (trivy fs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          # Pinned explicitly rather than relying on the action's bundled
          # default, which has previously pointed at a since-deleted Trivy
          # release (v0.65.0) and silently broken every job that used it.
          version: 'v0.70.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'
          # Report-only: surfaces findings in the Security tab without blocking
          # merges on a scanner false positive. Tighten to exit-code 1 once the
          # baseline is clean and this is protecting a real deployment.
          exit-code: '0'

      - name: Upload Trivy results to Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'
          category: 'trivy-fs'

  frontend-audit:
    name: dependency-scan (npm audit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/smartlogix-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/smartlogix-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit (high+ only, non-blocking report)
        run: npm audit --audit-level=high || true

  docker-image-scan:
    name: image-scan (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - ms-inventario
          - ms-pedidos
          - ms-envios
          - notification-service
          - ms-pagos
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: false
          load: true
          tags: smartlogix/${{ matrix.service }}:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: 'smartlogix/${{ matrix.service }}:ci'
          format: 'sarif'
          output: 'trivy-image-${{ matrix.service }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-${{ matrix.service }}.sarif'
          category: 'trivy-image-${{ matrix.service }}'

  frontend-image-scan:
    name: image-scan (frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: frontend/smartlogix-app
          push: false
          load: true
          tags: smartlogix/frontend:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.70.0'
          image-ref: 'smartlogix/frontend:ci'
          format: 'sarif'
          output: 'trivy-image-frontend.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-image-frontend.sarif'
          category: 'trivy-image-frontend'
