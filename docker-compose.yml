

services:
  # ── Bases de datos (Database-per-Service) ──
  postgres-auth:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - auth-data:/var/lib/postgresql/data
    networks:
      - smartlogix-net

  postgres-inventario:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inventario_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - inventario-data:/var/lib/postgresql/data
    networks:
      - smartlogix-net

  postgres-pedidos:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: pedidos_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pedidos-data:/var/lib/postgresql/data
    networks:
      - smartlogix-net

  postgres-envios:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: envios_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - envios-data:/var/lib/postgresql/data
    networks:
      - smartlogix-net

  postgres-pagos:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB:       pagos_db
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - pagos_data:/var/lib/postgresql/data
    networks: [smartlogix-net]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres"]
      interval: 10s
      retries: 5

  # ── Microservicios ──
  api-gateway:
    build: ./services/api-gateway
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      AUTH_URL:       http://auth-service:8081
      INVENTARIO_URL: http://ms-inventario:8082
      PEDIDOS_URL:    http://ms-pedidos:8083
      ENVIOS_URL:     http://ms-envios:8084
      PAGOS_URL:      http://ms-pagos:8086
    networks:
      - smartlogix-net

  # NOTE: auth-service intentionally has NO "ports:" mapping to the host
  # either (see the note above ms-inventario/ms-pedidos/ms-envios/ms-pagos/
  # notification-service). It now exposes GET /auth/interno/usuarios/{email}
  # (derecho de acceso ARCO+, arco-acceso-personal-data.md), guarded by its
  # own InternalAuthFilter — but that filter is only a hard requirement
  # *because* this port is closed; leaving 8081 published to the host would
  # let anyone curl that endpoint directly, with zero JWT and zero internal
  # auth check, bypassing both api-gateway and the filter (OWASP A01:2021).
  auth-service:
    build: ./services/auth-service
    environment:
      DB_HOST: postgres-auth
      DB_NAME: auth_db
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    depends_on:
      - postgres-auth
    networks:
      - smartlogix-net

  # NOTE: ms-inventario, ms-pedidos, ms-envios, notification-service and ms-pagos
  # intentionally have NO "ports:" mapping to the host. None of them implement their
  # own authentication (they trust the api-gateway's AuthFilter to validate the JWT
  # before a request ever reaches them). Publishing their ports to the host would let
  # anyone bypass the gateway entirely and hit them unauthenticated (OWASP A01:2021 -
  # Broken Access Control). They remain reachable from each other and from the gateway
  # via the internal "smartlogix-net" Docker network using their service name as host.
  ms-inventario:
    build: ./services/ms-inventario
    environment:
      DB_HOST: postgres-inventario
      DB_NAME: inventario_db
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    depends_on:
      - postgres-inventario
    networks:
      - smartlogix-net

  ms-pedidos:
    build: ./services/ms-pedidos
    environment:
      DB_HOST: postgres-pedidos
      DB_NAME: pedidos_db
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      INVENTARIO_URL: http://ms-inventario:8082
      ENVIOS_URL: http://ms-envios:8084
      NOTIFICATION_URL: http://notification-service:8085
    depends_on:
      - postgres-pedidos
      - ms-inventario
    networks:
      - smartlogix-net

  ms-envios:
    build: ./services/ms-envios
    environment:
      DB_HOST: postgres-envios
      DB_NAME: envios_db
      DB_USER: postgres
      DB_PASS: ${DB_PASS}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    depends_on:
      - postgres-envios
    networks:
      - smartlogix-net

  notification-service:
    build: ./services/notification-service
    environment:
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
    networks:
      - smartlogix-net

  ms-pagos:
    build: ./services/ms-pagos
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      DB_HOST:              postgres-pagos
      DB_NAME:              pagos_db
      DB_USER:              postgres
      DB_PASS:              ${DB_PASS}
      INTERNAL_SERVICE_SECRET: ${INTERNAL_SERVICE_SECRET}
      # Flow API — Sandbox (reemplazar con credenciales reales)
      FLOW_API_URL:         https://sandbox.flow.cl/api
      FLOW_API_KEY:         ${FLOW_API_KEY}
      FLOW_SECRET_KEY:      ${FLOW_SECRET_KEY}
      # Webhook URL — necesita ser pública. En desarrollo: ngrok
      FLOW_URL_CONFIRMATION: ${FLOW_URL_CONFIRMATION}
      FLOW_URL_RETURN:      ${FLOW_URL_RETURN}
      PEDIDOS_URL:          http://ms-pedidos:8083
      FLOW_VERIFY_SIGNATURE: ${FLOW_VERIFY_SIGNATURE}
    depends_on:
      postgres-pagos:
        condition: service_healthy
      ms-pedidos:
        condition: service_started
    networks: [smartlogix-net]


  frontend:
    build: ./frontend/smartlogix-app
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - smartlogix-net
  
volumes:
  auth-data: {}
  inventario-data: {}
  pedidos-data: {}
  envios-data: {}
  pagos_data: 
networks:
  smartlogix-net:
    driver: bridge
